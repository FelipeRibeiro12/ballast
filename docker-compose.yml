services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      # usados só pelo init que cria o papel da aplicação (ADR-021)
      DB_USER: ${DB_USER:?defina no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina no .env}
    # só loopback: o banco não fica exposto na rede local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ballast_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ballast_pgdata:
