#cloud-config
# Prepara a VM ARM do Oracle no primeiro boot (runbook, passo 3): atualizações, Docker, usuário
# deploy, /opt/ballast e as portas 80 e 443 no firewall do Ubuntu. Sem segredo aqui: o script fica
# guardado no Oracle e legível de dentro da VM. Senhas vão à mão em api.env e caddy.env.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - unattended-upgrades
  - iptables-persistent

users:
  - default
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      # Chave pública só do deploy: ssh-keygen -t ed25519 -N "" -f ~/.ssh/ballast_deploy -C deploy
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJg7OH4TNJ4h93LorA45U5FYRuto8nxUlSfBnM6uezhZ deploy

runcmd:
  # Docker Engine e plugin compose pelo repositório oficial (arm64)
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker unattended-upgrades
  # deploy pode usar o Docker; isso equivale a root na VM
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy -m 750 /opt/ballast
  # A imagem Ubuntu do Oracle rejeita tudo no INPUT menos a 22; abre 80 e 443 antes do REJECT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save
