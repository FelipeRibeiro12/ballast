name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    # senha descartável: o banco só existe dentro do job e não sai do runner
    # (o contexto env não vale em services, então o valor se repete no DATABASE_URL)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-descartavel
          POSTGRES_DB: ballast_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ballast_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: vet
        run: go vet ./...
        working-directory: api
      - uses: golangci/golangci-lint-action@v8
        with:
          # mesma versão do brew local; v2.14.0 é a primeira que linta Go 1.27
          version: v2.14.0
          working-directory: api
      - name: migrate
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up
        working-directory: api
        env:
          DATABASE_URL: postgres://ci:ci-descartavel@localhost:5432/ballast_ci?sslmode=disable
      - name: test
        run: go test -race ./...
        working-directory: api
        env:
          DATABASE_URL: postgres://ci:ci-descartavel@localhost:5432/ballast_ci?sslmode=disable

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # a versão vem do packageManager; o package.json fica em web/, não na raiz
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # roda antes do build: o build também regenera o arquivo e esconderia a divergência
      # status --porcelain cobre arquivo alterado e arquivo novo não rastreado
      - name: cliente TS em dia com o OpenAPI
        run: |
          pnpm generate:api
          if [ -n "$(git status --porcelain -- src/api)" ]; then
            git diff -- src/api | head -n 60
            echo "::error::src/api/schema.d.ts diverge de api/openapi.yaml. Rode 'pnpm --dir web generate:api' e commite o resultado."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
