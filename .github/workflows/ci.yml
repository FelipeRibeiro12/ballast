name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # o spotless não está ligado ao verify, então precisa de passo próprio
      - run: ./mvnw -B spotless:check
      # os testes sobem o Postgres via Testcontainers; o runner já tem Docker
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # a versão vem do packageManager; o package.json fica em web/, não na raiz
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # roda antes do build: o build também regenera o arquivo e esconderia a divergência
      # status --porcelain cobre arquivo alterado e arquivo novo não rastreado
      - name: cliente TS em dia com o OpenAPI
        run: |
          pnpm generate:api
          if [ -n "$(git status --porcelain -- src/api)" ]; then
            git diff -- src/api | head -n 60
            echo "::error::src/api/schema.d.ts diverge de api/openapi.yaml. Rode 'pnpm --dir web generate:api' e commite o resultado."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
