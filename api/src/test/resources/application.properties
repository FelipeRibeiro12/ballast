# Vale para todo contexto de teste, inclusive os @SpringBootTest sem IntegrationTest: o job de
# índices chamaria o Banco Central de verdade ao subir (ADR-037).
ballast.indices.job-enabled=false
# O mesmo para o job de cotação, que chamaria a CoinGecko (ADR-040).
ballast.cotacoes.job-enabled=false
# A suíte inteira chama do mesmo 127.0.0.1 e cadastra centenas de usuários; com os limites de
# produção ela mesma levaria 429. O RateLimitTest sobe contexto próprio com limites baixos.
ballast.rate-limit.general-per-minute=1000000
ballast.rate-limit.login-per-minute=1000000
ballast.rate-limit.registration-per-hour=1000000
ballast.rate-limit.auth-per-minute=1000000
# Pelo mesmo motivo, o teto de usuários do tier gratuito; o RegistrationCapTest testa com 2.
ballast.registration-max-users=1000000
# A limpeza de sessões rodaria às 4h no meio de uma suíte que atravessasse o horário.
ballast.identity-cleanup.job-enabled=false
