spring:
  application:
    name: ballast
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Banco fora: o padrão de 30 s seguraria o /healthz (e qualquer rota) por meio
      # minuto antes do 503. Com 2 s o health check responde logo; num app de um
      # usuário só, esperar mais do que isso por conexão já é falha.
      connection-timeout: 2000
  flyway:
    # ADR-021: a migração roda como dono do schema; a aplicação (datasource) só tem DML
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      app_user: ${DB_USER}
  jackson:
    deserialization:
      # O Boot ignora campo desconhecido por padrão; aqui vira 400, e lixo depois do JSON também.
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    mapper:
      # Sem isto, {"email": 1} viraria "1" em vez de erro.
      allow-coercion-of-scalars: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

ballast:
  # Vazio vale como o padrão: o .env.example deixa as chaves em branco.
  registration-open: ${REGISTRO_ABERTO:false}

logging:
  level:
    # O Hibernate loga o erro do driver, e o do Postgres traz "Key (email)=(...)" com o e-mail
    # inteiro. E-mail repetido é caminho esperado do cadastro e já é logado mascarado.
    org.hibernate.orm.jdbc.error: "OFF"

server:
  # loopback por padrão: sem HOST explícito a API não escuta na rede local
  address: ${HOST:127.0.0.1}
  port: ${PORT:8080}

springdoc:
  # Chaves ordenadas: a spec é commitada e comparada byte a byte no teste.
  writer-with-order-by-keys: true
