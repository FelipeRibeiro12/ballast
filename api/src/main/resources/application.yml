spring:
  application:
    name: ballast
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Banco fora: o padrão de 30 s seguraria o /healthz (e qualquer rota) por meio
      # minuto antes do 503. Com 2 s o health check responde logo; num app de um
      # usuário só, esperar mais do que isso por conexão já é falha.
      connection-timeout: 2000
      # Banco congelado (TCP aberto, ninguém responde): o Hikari valida cada conexão ociosa
      # antes de emprestá-la e, com o padrão de 5 s, uma só validação já estoura os 2 s acima
      # (pior caso: 5 s). Com 1 s, a segunda validação fecha o prazo em cerca de 2 s. Um banco
      # saudável responde o ping em milissegundos.
      validation-timeout: 1000
      data-source-properties:
        # Teto de leitura do socket (segundos), para a conexão presa num banco congelado não
        # ficar presa para sempre no pool. 30 s é folga para uma agregação lenta de verdade sem
        # resposta parcial; passou disso, a consulta é um problema a corrigir. O /healthz e a
        # consulta de sessão (a primeira de toda rota autenticada) usam um teto próprio de 2 s:
        # o Hikari não valida a conexão usada há menos de 500 ms, e sem esse teto a primeira
        # chamada com o banco congelado esperava os 30 s inteiros.
        socketTimeout: 30
  flyway:
    # ADR-021: a migração roda como dono do schema; a aplicação (datasource) só tem DML
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      app_user: ${DB_USER}
  jackson:
    read:
      # Chave repetida vira 400. Sem isto vale a última, e quem valida antes da API pode ter
      # visto a primeira.
      strict-duplicate-detection: true
    deserialization:
      # O Boot ignora campo desconhecido por padrão; aqui vira 400, e lixo depois do JSON também.
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
      # Sem isto, 12.5 ou 1e3 viram inteiro por truncamento: em campo de dinheiro seria um
      # centavo trocado sem erro.
      accept-float-as-int: false
    datatype:
      enum:
        # Sem isto, o número 0 vira o primeiro valor de um enum.
        fail-on-numbers-for-enums: true
    mapper:
      # Vale para número, booleano e enum. Campo String é coberto à parte, em web/JacksonConfig.
      allow-coercion-of-scalars: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

ballast:
  # Vazio vale como o padrão: o .env.example deixa as chaves em branco.
  registration-open: ${REGISTRO_ABERTO:false}
  # Teto de usuários do tier gratuito (ADR-049). Vazio vale 20.
  registration-max-users: ${CADASTRO_MAX_USUARIOS:}
  cookie-secure: ${COOKIE_SECURE:true}
  # Tetos por usuário (ADR-055). Vazio vale o padrão de cada um; aceita de 1 a 1.000.000.
  limits:
    accounts: ${LIMITE_CONTAS:}
    active-recurrences: ${LIMITE_RECORRENCIAS_ATIVAS:}
    installment-purchases: ${LIMITE_COMPRAS_PARCELADAS:}
    fixed-income-titles: ${LIMITE_TITULOS_RENDA_FIXA:}
    crypto-movements: ${LIMITE_MOVIMENTOS_CRIPTO:}
    crypto-assets: ${LIMITE_ATIVOS_CRIPTO:}
    quotes: ${LIMITE_COTACOES:}
    categories: ${LIMITE_CATEGORIAS:}
    third-parties: ${LIMITE_TERCEIROS:}
    balance-views: ${LIMITE_VISOES_SALDO:}
    pending-imports: ${LIMITE_IMPORTACOES_PENDENTES:}
    csv-mappings: ${LIMITE_MAPEAMENTOS_CSV:}
    wallets: ${LIMITE_CARTEIRAS:}
    # Prazo por instrução do DELETE /contas/{id}, como 15s ou 500ms. Vazio vale 15s.
    account-delete-timeout: ${TIMEOUT_APAGAR_CONTA:}
  origins:
    # Origens do navegador aceitas em POST, PUT, PATCH e DELETE além do próprio Host, separadas por
    # vírgula (ADR-051). Em produção, o domínio do app no Vercel.
    allowed: ${ORIGENS_PERMITIDAS:}
  app-env: ${APP_ENV:}
  mfa:
    # Chave AES-256 do segredo do TOTP, em base64 (ADR-050). Vazia, configurar MFA dá 503 e o login
    # de quem já tem MFA só aceita código de recuperação. Gere com openssl rand -base64 32.
    key: ${MFA_CHAVE:}
  identity-cleanup:
    # Apaga sessões vencidas ou revogadas e tentativas de login paradas há um dia. Para desligar,
    # BALLAST_IDENTITY_CLEANUP_JOB_ENABLED=false.
    job-enabled: true
    # 04:00 em America/Sao_Paulo, uma hora depois do job de recorrência.
    cron: "0 0 4 * * *"
  recurrence:
    # Liga o job diário que estende o horizonte das recorrências (ADR-026). Os testes de
    # integração desligam; para desligar fora deles, BALLAST_RECURRENCE_JOB_ENABLED=false.
    job-enabled: true
    # Spring cron (segundos primeiro), no fuso America/Sao_Paulo: 03:00 todo dia.
    cron: "0 0 3 * * *"
  cofrinho:
    # Liga o job que lança o rendimento diário do cofrinho (ADR-074). Os testes de integração
    # desligam; para desligar fora deles, BALLAST_COFRINHO_JOB_ENABLED=false.
    job-enabled: true
    # 03:30 em America/Sao_Paulo, trinta minutos depois do crédito do banco.
    cron: "0 30 3 * * *"
  indices:
    # API pública do SGS do Banco Central, sem chave (ADR-037).
    base-url: https://api.bcb.gov.br
    # Baixa CDI e IPCA ao subir e todo dia às 8h em America/Sao_Paulo. Para desligar,
    # BALLAST_INDICES_JOB_ENABLED=false.
    job-enabled: true
    cron: "0 0 8 * * *"
  cotacoes:
    # API v3 da CoinGecko, plano Demo (ADR-040). Sem COINGECKO_API_KEY o job não chama nada.
    base-url: ${COINGECKO_API_URL:https://api.coingecko.com/api/v3}
    api-key: ${COINGECKO_API_KEY:}
    # Para desligar, BALLAST_COTACOES_JOB_ENABLED=false.
    job-enabled: true
    # Com os nativos e as cinco plataformas de token, no pior caso 6 pedidos por rodada:
    # a cada 30 min são uns 8.700 por mês, dentro dos 10 mil do plano Demo.
    interval: PT30M
  posse:
    # Domínio que entra na mensagem assinada na prova de posse (ADR-072). Obrigatório fora de
    # APP_ENV=development; lá o padrão é localhost:5173.
    domain: ${BALLAST_POSSE_DOMAIN:}
  carteiras:
    # Alchemy, plano gratuito (ADR-071). Sem ALCHEMY_API_KEY o job não roda e a leitura manual
    # responde que o indexador não está configurado. As URLs são a raiz de cada rede, sem a chave.
    api-key: ${ALCHEMY_API_KEY:}
    ethereum-url: ${ALCHEMY_ETHEREUM_URL:}
    base-url: ${ALCHEMY_BASE_URL:}
    solana-url: ${ALCHEMY_SOLANA_URL:}
    # Desligado por padrão. Para ligar, BALLAST_CARTEIRAS_JOB_ENABLED=true.
    job-enabled: false
    # Lê a carteira uma vez logo depois de cadastrada, em segundo plano. Sem chave não faz nada.
    first-read-enabled: true
    interval: PT6H
    # Pausa entre uma carteira e a seguinte, para não gastar a cota do plano gratuito de uma vez.
    pause: PT1S
  seed:
    email: ${SEED_EMAIL:}
    password: ${SEED_SENHA:}
    name: ${SEED_NOME:}

logging:
  level:
    # O Hibernate loga o erro do driver, e o do Postgres traz "Key (email)=(...)" com o e-mail
    # inteiro. E-mail repetido é caminho esperado do cadastro e já é logado mascarado.
    org.hibernate.orm.jdbc.error: "OFF"
    # Em DEBUG estes loggers escrevem a URL da chamada, e a URL da Alchemy leva a chave. Subir o
    # nível aqui vaza a chave no log (ADR-071).
    org.springframework.web.client: "WARN"
    org.springframework.http.client: "WARN"

server:
  # loopback por padrão: sem HOST explícito a API não escuta na rede local
  address: ${HOST:127.0.0.1}
  port: ${PORT:8080}

springdoc:
  api-docs:
    # Desligado por padrão: a spec descreve a superfície inteira da API e produção não precisa
    # servi-la. Só liga com API_DOCS_ENABLED=true explícito (desenvolvimento) ou no teste.
    enabled: ${API_DOCS_ENABLED:false}
  # Chaves ordenadas: a spec é commitada e comparada byte a byte no teste.
  writer-with-order-by-keys: true
