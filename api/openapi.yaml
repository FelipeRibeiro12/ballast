        -lo. Ocorrência prevista de recorrência não se apaga (400 \"cancele a ocorrê\
        ncia\"): cancele. Realizada ou cancelada pode ser apagada, e se a data é de\
        \ hoje em diante e a recorrência segue ativa, o job volta a gerar a ocorrê\
        ncia como prevista."
      operationId: deleteLancamentosById
