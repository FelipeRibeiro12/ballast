components:
  schemas:
    ApagarContaRequest:
      type: object
      properties:
        codigo:
          type: string
          description: "Código do autenticador ou de recuperação, de 1 a 32 caracteres"
          maxLength: 32
          minLength: 1
      required:
      - codigo
    AporteMeta:
      type: object
      properties:
        data:
          type: string
          format: date
        id:
          type: string
          format: uuid
        transferenciaId:
          type:
          - string
          - "null"
          format: uuid
          description: Transferência ligada ao aporte; nulo quando não há
        valorCentavos:
          type: integer
          format: int64
          description: "Positivo guardou, negativo retirou"
          maximum: 9007199254740991
          minimum: -9007199254740991
      required:
      - data
      - id
      - transferenciaId
      - valorCentavos
    AporteMetaRequest:
      type: object
      properties:
        data:
          type: string
          format: date
        transferenciaId:
          type:
          - string
          - "null"
          format: uuid
          description: "Transferência que moveu o dinheiro. Opcional; uma transferê\
            ncia liga no máximo um aporte e, ligada, não pode ser apagada"
        valorCentavos:
          type: integer
          format: int64
          description: "Positivo guarda, negativo retira. Zero não vale"
          maximum: 9007199254740991
          minimum: -9007199254740991
      required:
      - data
      - valorCentavos
    AtivoCripto:
      type: object
      properties:
        confiavel:
          type: boolean
          description: Sempre true no ativo digitado pelo usuário
        contrato:
          type:
          - string
          - "null"
          description: Nulo no ativo nativo; em minúsculas nas redes EVM
        decimais:
          type: integer
          format: int32
          maximum: 18
          minimum: 0
        id:
          type: string
          format: uuid
        nome:
          type:
          - string
          - "null"
          maxLength: 100
        rede:
          type: string
          enum:
          - bitcoin
          - ethereum
          - base
          - arbitrum
          - polygon
          - solana
        simbolo:
          type: string
          maxLength: 20
          minLength: 1
      required:
      - confiavel
      - contrato
      - decimais
      - id
      - nome
      - rede
      - simbolo
    AtivoCriptoEdicao:
      type: object
      properties:
        confiavel:
          type:
          - boolean
          - "null"
          description: "Ausente ou nulo mantém o valor atual. Verdadeiro promove o\
            \ ativo que veio de uma leitura de carteira (ADR-071): ele passa a valer\
            \ no patrimônio"
        decimais:
          type: integer
          format: int32
          maximum: 18
          minimum: 0
        nome:
          type:
          - string
          - "null"
          maxLength: 100
        simbolo:
          type: string
          maxLength: 20
          minLength: 1
      required:
      - decimais
      - simbolo
    AtivoCriptoRequest:
      type: object
      properties:
        contrato:
          type:
          - string
          - "null"
          description: "Ausente ou nulo é o ativo nativo da rede. EVM: 0x mais 40\
            \ hexadecimais, gravado em minúsculas. Solana: base58 de 32 a 44. Bitcoin:\
            \ sempre nulo"
        decimais:
          type: integer
          format: int32
          maximum: 18
          minimum: 0
        nome:
          type:
          - string
          - "null"
          maxLength: 100
        rede:
          type: string
          enum:
          - bitcoin
          - ethereum
          - base
          - arbitrum
          - polygon
          - solana
        simbolo:
          type: string
          maxLength: 20
          minLength: 1
      required:
      - decimais
      - rede
      - simbolo
    AtualizarCartaoRequest:
      type: object
      properties:
        contaPagamentoId:
          type: string
          format: uuid
        limiteCentavos:
          type: integer
          format: int64
          maximum: 9007199254740991
          minimum: 1
    AtualizarContaRequest:
      type: object
      properties:
        arquivada:
          type: boolean
        cartao:
          $ref: "#/components/schemas/AtualizarCartaoRequest"
          description: Só em conta de cartão. Fechamento e vencimento não se editam
            (ADR-031)
        nome:
          type: string
          maxLength: 100
          minLength: 1
        saldoInicialCentavos:
          type: integer
          format: int64
          maximum: 9007199254740991
          minimum: -9007199254740991
    BeneficioLivre:
      type: object
      properties:
        contaId:
          type: string
          format: uuid
        livreCentavos:
          type: integer
          format: int64
          description: Menor saldo projetado da conta até ate
          maximum: 9007199254740991
          minimum: -9007199254740991
        nome:
          type: string
      required:
      - contaId
      - livreCentavos
      - nome
    CadastroRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        nome:
          type: string
          maxLength: 100
        senha:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - email
      - senha
    Cartao:
      type: object
      properties:
        contaPagamentoId:
          type: string
          format: uuid
        diaFechamento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        diaVencimento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        disponivelCentavos:
          type: integer
          format: int64
          description: "Limite mais o saldo da conta, nunca acima do limite. Negativo\
            \ quando a dívida passa do limite"
          maximum: 9007199254740991
          minimum: -9007199254740990
        limiteCentavos:
          type: integer
          format: int64
          description: "Centavos de real, sempre positivo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - contaPagamentoId
      - diaFechamento
      - diaVencimento
      - disponivelCentavos
      - limiteCentavos
    CartaoRequest:
      type: object
      properties:
        contaPagamentoId:
          type: string
          format: uuid
          description: "Conta corrente ou poupança ativa do usuário, de onde sai a\
            \ fatura"
        diaFechamento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        diaVencimento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        limiteCentavos:
          type: integer
          format: int64
          description: "Centavos de real. Informativo: não bloqueia lançamento"
          maximum: 9007199254740991
          minimum: 1
      required:
      - contaPagamentoId
      - diaFechamento
      - diaVencimento
      - limiteCentavos
    Carteira:
      type: object
      properties:
        contaId:
          type: string
          format: uuid
        endereco:
          type: string
          description: EVM em minúsculas; Solana como foi cadastrado
        id:
          type: string
          format: uuid
        leituraFalhou:
          type: boolean
          description: "A última tentativa de leitura falhou: os saldos são os de\
            \ sincronizadaEm, não zero"
        rede:
          type: string
          enum:
          - ethereum
          - base
          - solana
        rotulo:
          type:
          - string
          - "null"
          maxLength: 60
        saldos:
          type: array
          items:
            $ref: "#/components/schemas/SaldoCarteira"
        sincronizadaEm:
          type:
          - string
          - "null"
          format: date-time
          description: Última leitura que deu certo; nulo se nunca leu
      required:
      - contaId
      - endereco
      - id
      - leituraFalhou
      - rede
      - rotulo
      - saldos
      - sincronizadaEm
    CarteiraRequest:
      type: object
      properties:
        contaId:
          type: string
          format: uuid
        endereco:
          type: string
          description: "EVM: 0x mais 40 hexadecimais, com checksum EIP-55 se tiver\
            \ caixa mista, gravado em minúsculas. Solana: base58 que decodifica em\
            \ 32 bytes"
          maxLength: 100
          minLength: 1
        rede:
          type: string
          enum:
          - ethereum
          - base
          - solana
          pattern: ethereum|base|solana
        rotulo:
          type:
          - string
          - "null"
          maxLength: 60
      required:
      - contaId
      - endereco
      - rede
    Categoria:
      type: object
      properties:
        cor:
          type:
          - string
          - "null"
          maxLength: 9
        icone:
          type:
          - string
          - "null"
          maxLength: 50
        id:
          type: string
          format: uuid
        nome:
          type: string
          maxLength: 100
          minLength: 1
        paiId:
          type:
          - string
          - "null"
          format: uuid
        protegida:
          type: boolean
          description: "Outros e Outras receitas: não renomeia nem apaga"
        tipo:
          type: string
          enum:
          - receita
          - despesa
      required:
      - cor
      - icone
      - id
      - nome
      - paiId
      - protegida
      - tipo
    CategoriaRenomearRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          minLength: 1
      required:
      - nome
    CategoriaRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          minLength: 1
        tipo:
          type: string
          description: Só no cadastro; o tipo não muda depois
          enum:
          - receita
          - despesa
      required:
      - nome
