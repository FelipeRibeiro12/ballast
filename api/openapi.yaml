      description: "Grava a regra, o template e, na mesma transação, as ocorrências\
        \ previstas de max(inicio, hoje) até hoje mais 12 meses, as duas pontas incluí\
        das. A data que a regra gera antes de hoje não vira lançamento. Hoje é a data\
        \ em America/Sao_Paulo. Conta e categoria precisam ser do usuário e a categoria\
        \ do mesmo tipo do template. Uma série que já terminou é criada com zero ocorrê\
        ncias."
      operationId: postRecorrencias
      parameters:
      - description: "Chave de idempotência, de 1 a 80 caracteres entre letras, dí\
          gitos e . _ : -. Mesma chave, usuário, rota e corpo devolve a resposta 2xx\
          \ original (cabeçalho Idempotent-Replayed: true) sem gravar de novo; vale\
