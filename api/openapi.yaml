          description: Lançamento com os valores novos
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado e tipo transferencia;\
            \ \"conta não encontrada\", \"conta arquivada\" (só ao trocar de conta),\
            \ \"categoria não encontrada\", \"saldo da conta fora do limite\" (em\
            \ qualquer das contas afetadas) ou \"use a rota de transferência\" (o\
            \ lançamento é perna de transferência)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Lançamento de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
