openapi: 3.1.0
info:
  title: Ballast API
  version: 0.1.0
servers:
- url: /
paths:
  /auth/cadastro:
    post:
      description: "A rota só existe quando REGISTRO_ABERTO=true. Fechado, ela responde\
        \ exatamente como uma rota inexistente (401 sem sessão, 404 com sessão), para\
        \ não revelar que existe."
      operationId: postAuthCadastro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: E-mail já cadastrado
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Cria um usuário
      tags:
      - auth
  /auth/eu:
    get:
      operationId: getAuthEu
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário da sessão
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Sem cookie, ou token desconhecido, expirado ou revogado; todos\
            \ iguais"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      security:
      - cookieAuth: []
      summary: Devolve o usuário da sessão
      tags:
      - auth
  /auth/login:
    post:
      description: "A sessão vai no cookie ballast_sessao (HttpOnly, Secure, SameSite=Lax),\
        \ válido por 7 dias absolutos, sem renovação. E-mail inexistente e senha errada\
        \ dão a mesma resposta."
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: ballast_sessao=<token>; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=604800
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Credenciais inválidas
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Atraso progressivo em vigor para esse e-mail; resposta idêntica
            para e-mail com e sem conta
          headers:
            Retry-After:
              description: "Segundos inteiros, arredondados para cima, até a próxima\
                \ tentativa ser verificada"
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Abre uma sessão
      tags:
      - auth
  /auth/logout:
    post:
      description: Marca a sessão como revogada no servidor e expira o cookie. Sem
        sessão válida também responde 204. Não lê corpo.
      operationId: postAuthLogout
      responses:
        "204":
          description: "Sessão encerrada, ou não havia sessão"
          headers:
            Set-Cookie:
              description: ballast_sessao=; HttpOnly; Secure; SameSite=Lax; Path=/;
                Max-Age=0
              required: true
              schema:
                type: string
              style: simple
        "413":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Length acima de 4 KiB; o corpo nunca é lido
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna; a sessão pode não ter sido revogada
      summary: Encerra a sessão
      tags:
      - auth
  /contas:
    get:
      description: "Ordenada por nome sem diferenciar caixa. Sem o parâmetro, devolve\
        \ só as ativas."
      operationId: getContas
      parameters:
      - in: query
        name: arquivadas
        required: false
        schema:
          type: string
          default: false
          enum:
          - "true"
          - "false"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conta"
          description: "Contas ativas, ou só as arquivadas com arquivadas=true"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: arquivadas com valor diferente de true e false
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista as contas do usuário
      tags:
      - contas
    post:
      operationId: postContas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarContaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta criada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Já existe uma conta do usuário com esse nome, sem diferenciar\
            \ caixa"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Cria uma conta
      tags:
      - contas
  /contas/{id}:
    get:
      operationId: getContasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Devolve uma conta do usuário
      tags:
      - contas
    patch:
      description: "Idempotente: repetir o mesmo valor devolve 200 e a mesma conta."
      operationId: patchContasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarContaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta com o estado novo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Arquiva ou desarquiva uma conta
      tags:
      - contas
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: API e banco respondendo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
          description: Banco indisponível
      summary: Verifica se a API alcança o banco
      tags:
      - health
components:
  schemas:
    AtualizarContaRequest:
      type: object
      properties:
        arquivada:
          type: boolean
      required:
      - arquivada
    CadastroRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        nome:
          type: string
          maxLength: 100
          minLength: 0
        senha:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - email
      - senha
    Conta:
      type: object
      properties:
        arquivada:
          type: boolean
        criadaEm:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        moeda:
          type: string
          enum:
          - BRL
        nome:
          type: string
          maxLength: 100
          minLength: 1
        saldoCentavos:
          type: integer
          format: int64
          description: "Centavos de real, inteiro com sinal"
          maximum: 9007199254740991
          minimum: -9007199254740991
        saldoInicialCentavos:
          type: integer
          format: int64
          description: "Centavos de real, inteiro com sinal"
          maximum: 9007199254740991
          minimum: -9007199254740991
        tipo:
          type: string
          enum:
          - corrente
          - poupanca
          - dinheiro
      required:
      - arquivada
      - criadaEm
      - id
      - moeda
      - nome
      - saldoCentavos
      - saldoInicialCentavos
      - tipo
    CriarContaRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          minLength: 1
        saldoInicialCentavos:
          type: integer
          format: int64
          default: 0
          maximum: 9007199254740991
          minimum: -9007199254740991
        tipo:
          type: string
          enum:
          - corrente
          - poupanca
          - dinheiro
      required:
      - nome
      - tipo
    Erro:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthError:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthResponse:
      type: object
      properties:
        mensagem:
          type: string
      required:
      - mensagem
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        senha:
          type: string
          maxLength: 128
          minLength: 1
      required:
      - email
      - senha
    Usuario:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        id:
          type: string
          format: uuid
        nome:
          type:
          - string
          - "null"
          maxLength: 100
      required:
      - email
      - id
      - nome
  securitySchemes:
    cookieAuth:
      in: cookie
      name: ballast_sessao
      type: apiKey
