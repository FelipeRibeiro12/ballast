openapi: 3.1.0
info:
  title: Ballast API
  version: 0.1.0
servers:
- url: /
paths:
  /auth/cadastro:
    post:
      description: "A rota só existe quando REGISTRO_ABERTO=true. Fechado, ela responde\
        \ exatamente como uma rota inexistente (401 sem sessão, 404 com sessão), para\
        \ não revelar que existe."
      operationId: postAuthCadastro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: E-mail já cadastrado
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Cria um usuário
      tags:
      - auth
  /auth/eu:
    get:
      operationId: getAuthEu
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário da sessão
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Sem cookie, ou token desconhecido, expirado ou revogado; todos\
            \ iguais"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      security:
      - cookieAuth: []
      summary: Devolve o usuário da sessão
      tags:
      - auth
  /auth/login:
    post:
      description: "A sessão vai no cookie ballast_sessao (HttpOnly, Secure, SameSite=Lax),\
        \ válido por 7 dias absolutos, sem renovação. E-mail inexistente e senha errada\
        \ dão a mesma resposta."
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: ballast_sessao=<token>; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=604800
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Credenciais inválidas
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Atraso progressivo em vigor para esse e-mail; resposta idêntica
            para e-mail com e sem conta
          headers:
            Retry-After:
              description: "Segundos inteiros, arredondados para cima, até a próxima\
                \ tentativa ser verificada"
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Abre uma sessão
      tags:
      - auth
  /auth/logout:
    post:
      description: Marca a sessão como revogada no servidor e expira o cookie. Sem
        sessão válida também responde 204. Não lê corpo.
      operationId: postAuthLogout
      responses:
        "204":
          description: "Sessão encerrada, ou não havia sessão"
          headers:
            Set-Cookie:
              description: ballast_sessao=; HttpOnly; Secure; SameSite=Lax; Path=/;
                Max-Age=0
              required: true
              schema:
                type: string
              style: simple
        "413":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Length acima de 4 KiB; o corpo nunca é lido
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna; a sessão pode não ter sido revogada
      summary: Encerra a sessão
      tags:
      - auth
  /categorias:
    get:
      description: "Ordenada por tipo (despesa antes de receita) e nome sem diferenciar\
        \ caixa. Sem o parâmetro, devolve os dois tipos."
      operationId: getCategorias
      parameters:
      - in: query
        name: tipo
        required: false
        schema:
          type: string
          enum:
          - receita
          - despesa
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
          description: Categorias do usuário
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: tipo com valor diferente de receita e despesa
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista as categorias do usuário
      tags:
      - categorias
  /compras-parceladas:
    post:
      description: "Cria de 2 a 48 parcelas de despesa realizada na conta de cartã\
        o, numa transação só. O saldo do cartão cai pelo total na hora, e cada parcela\
        \ aparece na fatura do seu vencimento. Conta e categoria precisam ser do usuá\
        rio; conta inexistente, de outro usuário e id inválido têm a mesma mensagem."
      operationId: postComprasParceladas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraParceladaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompraParcelada"
          description: Compra criada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado; \"conta nã\
            o encontrada\", \"compra parcelada só em cartão de crédito\", \"conta\
            \ arquivada\", \"categoria não encontrada\", \"cada parcela precisa ter\
            \ ao menos 1 centavo\" ou \"saldo da conta fora do limite\""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Cria uma compra parcelada no cartão
      tags:
      - compras-parceladas
  /compras-parceladas/{id}:
    delete:
      description: Apaga todas as parcelas que ainda existem numa instrução só. O
        saldo do cartão volta.
      operationId: deleteComprasParceladasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: object
          description: Compra apagada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "\"saldo da conta fora do limite\": apagar tiraria o saldo\
            \ da faixa e nada é apagado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Compra de outro usuário, inexistente, id de outra parcela\
            \ ou id que não é UUID; todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Apaga a compra parcelada inteira
      tags:
      - compras-parceladas
    get:
      description: "O id é o da primeira parcela. valorTotalCentavos é a soma das\
        \ parcelas que ainda existem: depois de editar ou apagar uma parcela em /lancamentos,\
        \ ele muda. parcelas continua sendo o número de parcelas da compra ao nascer."
      operationId: getComprasParceladasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompraParcelada"
          description: Compra
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Compra de outro usuário, inexistente, id de outra parcela\
            \ ou id que não é UUID; todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível; pode tentar de novo
      security:
      - cookieAuth: []
      summary: Devolve uma compra parcelada
      tags:
      - compras-parceladas
    patch:
      description: "Aplica titulo, descricao e categoriaId em todas as parcelas na\
        \ mesma transação. Pelo menos um dos três; campo ausente não muda, e descricao\
        \ vazia limpa a descrição. Valor, número de parcelas, data e conta não se\
        \ editam: apague a compra e lance de novo. Vale também com o cartão arquivado."
      operationId: patchComprasParceladasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompraParceladaAtualizarRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompraParcelada"
          description: Compra com os valores novos
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Nenhum campo, campo não declarado ou valor inválido; \"categoria\
            \ não encontrada\""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Compra de outro usuário, inexistente, id de outra parcela\
            \ ou id que não é UUID; todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Muda o texto e a categoria da compra inteira
      tags:
      - compras-parceladas
  /contas:
    get:
      description: "Ordenada por nome sem diferenciar caixa. Sem o parâmetro, devolve\
        \ só as ativas."
      operationId: getContas
      parameters:
      - in: query
        name: arquivadas
        required: false
        schema:
          type: string
          default: false
          enum:
          - "true"
          - "false"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conta"
          description: "Contas ativas, ou só as arquivadas com arquivadas=true"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: arquivadas com valor diferente de true e false
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista as contas do usuário
      tags:
      - contas
    post:
      operationId: postContas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarContaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta criada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado, cartao fora\
            \ de conta de cartão (ou ausente nela) e conta de pagamento inexistente,\
            \ de outro usuário, arquivada ou de tipo que não paga cartão"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Já existe uma conta do usuário com esse nome, sem diferenciar\
            \ caixa"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Cria uma conta
      tags:
      - contas
  /contas/{id}:
    get:
      operationId: getContasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Devolve uma conta do usuário
      tags:
      - contas
    patch:
      description: "Idempotente: repetir o mesmo valor devolve 200 e a mesma conta."
      operationId: patchContasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarContaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta com o estado novo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou conta travada por mais de 2 s
      security:
      - cookieAuth: []
      summary: Arquiva ou desarquiva uma conta
      tags:
      - contas
  /contas/{id}/faturas:
    get:
      description: "Todas as faturas com vencimento entre de e ate (pontas incluí\
        das, no máximo 366 dias), em ordem de vencimento, inclusive as sem compra.\
        \ pago soma as transferências realizadas para o cartão depois do fechamento\
        \ da fatura e até o fechamento da seguinte, inclusive; pagamento feito antes\
        \ do fechamento conta na fatura anterior. situacao é aberta até o dia do fechamento\
        \ (inclusive, em America/Sao_Paulo), só pela data; depois dele, fechada com\
        \ restante maior que zero e paga com restante menor ou igual a zero."
      operationId: getContasByIdFaturas
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: de
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: ate
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faturas"
          description: Faturas do período
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "de ou ate ausente ou fora do formato AAAA-MM-DD (ano de 1900\
            \ a 2199), de depois de ate, intervalo maior que 366 dias ou \"fatura\
            \ fora do limite\" (algum valor sairia de ±9007199254740991 centavos)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente, id que não é UUID ou\
            \ conta que não é cartão; todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível; pode tentar de novo
      security:
      - cookieAuth: []
      summary: Lista as faturas de um cartão por vencimento
      tags:
      - cartao
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: API e banco respondendo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
          description: Banco indisponível
      summary: Verifica se a API alcança o banco
      tags:
      - health
  /lancamentos:
    get:
      description: "Filtra por dataCaixa, com as duas pontas incluídas, do mais novo\
        \ para o mais antigo (depois criadoEm e id, também decrescentes). de e ate\
        \ são obrigatórios e o intervalo tem no máximo 366 dias contando os dois extremos.\
        \ contaId, se vier, precisa ser um UUID; conta que não é do usuário ou nã\
        o existe devolve lista vazia, sem distinguir."
      operationId: getLancamentos
      parameters:
      - in: query
        name: de
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: ate
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: contaId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lancamento"
          description: Lançamentos do período
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "de ou ate ausente ou fora do formato AAAA-MM-DD (ano de 1900\
            \ a 2199), de depois de ate, intervalo maior que 366 dias ou contaId que\
            \ não é UUID"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Lista os lançamentos do usuário num período
      tags:
      - lancamentos
    post:
      description: "A data enviada vai para dataCompetencia e dataCaixa. Conta e categoria\
        \ precisam ser do usuário, e a categoria precisa ser do mesmo tipo do lanç\
        amento; os três casos de recusa (inexistente, de outro usuário, id inválido)\
        \ têm a mesma mensagem."
      operationId: postLancamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
          description: Lançamento criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado; \"conta nã\
            o encontrada\", \"conta arquivada\", \"categoria não encontrada\" ou \"\
            saldo da conta fora do limite\" (o saldo passaria de 9007199254740991\
            \ centavos, para mais ou para menos)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
