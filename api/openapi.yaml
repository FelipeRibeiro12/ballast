            conta arquivada\", \"categoria não encontrada\" ou \"categoria não permitida\
            \ nesta conta\" (despesa em conta de benefício, fora da lista da conta)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Teto de recorrências ativas do usuário atingido (limite de
            recorrências ativas atingido)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Idempotency-Key já usada com outra rota ou outro corpo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Cria uma recorrência e materializa as ocorrências dos próximos 12 meses
