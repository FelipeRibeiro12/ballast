components:
  schemas:
    AtualizarContaRequest:
      type: object
      properties:
        arquivada:
          type: boolean
      required:
      - arquivada
    CadastroRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        nome:
          type: string
          maxLength: 100
        senha:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - email
      - senha
    Cartao:
      type: object
      properties:
        contaPagamentoId:
          type: string
          format: uuid
        diaFechamento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        diaVencimento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        disponivelCentavos:
          type: integer
          format: int64
          description: "Limite mais o saldo da conta, nunca acima do limite. Negativo\
            \ quando a dívida passa do limite"
          maximum: 9007199254740991
          minimum: -9007199254740990
        limiteCentavos:
          type: integer
          format: int64
          description: "Centavos de real, sempre positivo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - contaPagamentoId
      - diaFechamento
      - diaVencimento
      - disponivelCentavos
      - limiteCentavos
    CartaoRequest:
      type: object
      properties:
        contaPagamentoId:
          type: string
          format: uuid
          description: "Conta corrente ou poupança ativa do usuário, de onde sai a\
            \ fatura"
        diaFechamento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        diaVencimento:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        limiteCentavos:
          type: integer
          format: int64
          description: "Centavos de real. Informativo: não bloqueia lançamento"
          maximum: 9007199254740991
          minimum: 1
      required:
      - contaPagamentoId
      - diaFechamento
      - diaVencimento
      - limiteCentavos
    Categoria:
      type: object
      properties:
        cor:
          type:
          - string
          - "null"
          maxLength: 9
        icone:
          type:
          - string
          - "null"
          maxLength: 50
        id:
          type: string
          format: uuid
        nome:
          type: string
          maxLength: 100
          minLength: 1
        paiId:
          type:
          - string
          - "null"
          format: uuid
        tipo:
          type: string
          enum:
          - receita
          - despesa
      required:
      - cor
      - icone
      - id
      - nome
      - paiId
      - tipo
    CompraParcelada:
      type: object
      properties:
