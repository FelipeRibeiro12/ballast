  /lancamentos:
    get:
      description: "Filtra por dataCaixa, com as duas pontas incluídas, do mais novo\
        \ para o mais antigo (depois criadoEm e id, também decrescentes). de e ate\
        \ são obrigatórios e o intervalo tem no máximo 366 dias contando os dois extremos.\
        \ contaId, se vier, precisa ser um UUID; conta que não é do usuário ou nã\
        o existe devolve lista vazia, sem distinguir. limite (1 a 1000, padrão 1000)\
        \ corta a página; se houver mais, o cabeçalho X-Next-Cursor traz o cursor\
        \ para o parâmetro cursor da próxima chamada, com os mesmos filtros. Sem mais\
        \ itens o cabeçalho não vem."
      operationId: getLancamentos
      parameters:
      - in: query
        name: de
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: ate
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: contaId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: limite
        required: false
        schema:
          type: integer
          default: 1000
          maximum: 1000
          minimum: 1
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lancamento"
          description: Lançamentos do período
          headers:
            X-Next-Cursor:
              description: Cursor da próxima página; ausente na última
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "de ou ate ausente ou fora do formato AAAA-MM-DD (ano de 1900\
            \ a 2199), de depois de ate, intervalo maior que 366 dias, contaId que\
            \ não é UUID, limite fora de 1 a 1000 ou cursor inválido"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Lista os lançamentos do usuário num período
      tags:
      - lancamentos
    post:
      description: "A data enviada vai para dataCompetencia e dataCaixa. Conta e categoria\
        \ precisam ser do usuário, e a categoria precisa ser do mesmo tipo do lanç\
        amento; os três casos de recusa (inexistente, de outro usuário, id inválido)\
        \ têm a mesma mensagem."
      operationId: postLancamentos
      parameters:
      - description: "Chave de idempotência, de 1 a 80 caracteres entre letras, dí\
          gitos e . _ : -. Mesma chave, usuário, rota e corpo devolve a resposta 2xx\
          \ original (cabeçalho Idempotent-Replayed: true) sem gravar de novo; vale\
          \ por 24 h."
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 80
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
          description: Lançamento criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado; \"transferê\
            ncia só pela rota /transferencias\" (tipo transferencia); \"conta não\
            \ encontrada\", \"conta arquivada\", \"categoria não encontrada\", \"\
            categoria não permitida nesta conta\" (despesa em conta de benefício,\
            \ fora da lista da conta) ou \"saldo da conta fora do limite\" (o saldo\
            \ passaria de 9007199254740991 centavos, para mais ou para menos)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Chave com outra requisição igual ainda em andamento; tentar
            de novo
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Idempotency-Key já usada com outra rota ou outro corpo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Cria um lançamento realizado
      tags:
      - lancamentos
