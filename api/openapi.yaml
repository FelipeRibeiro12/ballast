openapi: 3.1.0
info:
  title: Ballast API
  version: 0.1.0
servers:
- url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: API e banco respondendo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
          description: Banco indisponível
      summary: Verifica se a API alcança o banco
      tags:
      - health
components:
  schemas:
    HealthError:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthResponse:
      type: object
      properties:
        mensagem:
          type: string
      required:
      - mensagem
