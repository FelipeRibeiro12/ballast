  /importacoes/{id}/confirmacao:
    post:
      description: "Sem corpo. Cada linha vale pela decisão ou, sem ela, pela proposta:\
        \ importar cria o lançamento pelas mesmas regras do POST /lancamentos (dataCompetencia\
        \ é a data do arquivo; dataCaixa segue a conta), conciliar só grava o vínculo\
        \ no lançamento existente e ignorar não grava nada. Linha cujo FITID entrou\
        \ no meio-tempo conta como duplicada. Tudo numa transação: uma recusa de regra\
        \ desfaz a confirmação inteira. Aceita Idempotency-Key (ADR-056)."
      operationId: postImportacoesByIdConfirmacao
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: "Chave de idempotência, de 1 a 80 caracteres entre letras, dí\
          gitos e . _ : -. Mesma chave, usuário, rota e corpo devolve a resposta 2xx\
          \ original (cabeçalho Idempotent-Replayed: true) sem gravar de novo; vale\
          \ por 24 h."
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 80
          minLength: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportacaoConfirmacao"
          description: "Importação confirmada, com a contagem por resultado"
        "400":
