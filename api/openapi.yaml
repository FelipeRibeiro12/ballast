openapi: 3.1.0
info:
  title: Ballast API
  version: 0.1.0
servers:
- url: /
paths:
  /auth/cadastro:
    post:
      description: "A rota só existe quando REGISTRO_ABERTO=true. Fechado, ela responde\
        \ exatamente como uma rota inexistente (401 sem sessão, 404 com sessão), para\
        \ não revelar que existe."
      operationId: postAuthCadastro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: E-mail já cadastrado
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Cria um usuário
      tags:
      - auth
  /auth/eu:
    get:
      operationId: getAuthEu
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário da sessão
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Sem cookie, ou token desconhecido, expirado ou revogado; todos\
            \ iguais"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      security:
      - cookieAuth: []
      summary: Devolve o usuário da sessão
      tags:
      - auth
  /auth/login:
    post:
      description: "A sessão vai no cookie ballast_sessao (HttpOnly, Secure, SameSite=Lax),\
        \ válido por 7 dias absolutos, sem renovação. E-mail inexistente e senha errada\
        \ dão a mesma resposta."
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: ballast_sessao=<token>; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=604800
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Credenciais inválidas
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Atraso progressivo em vigor para esse e-mail; resposta idêntica
            para e-mail com e sem conta
          headers:
            Retry-After:
              description: "Segundos inteiros, arredondados para cima, até a próxima\
                \ tentativa ser verificada"
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Abre uma sessão
      tags:
      - auth
  /auth/logout:
    post:
      description: Marca a sessão como revogada no servidor e expira o cookie. Sem
        sessão válida também responde 204. Não lê corpo.
      operationId: postAuthLogout
      responses:
        "204":
          description: "Sessão encerrada, ou não havia sessão"
          headers:
            Set-Cookie:
              description: ballast_sessao=; HttpOnly; Secure; SameSite=Lax; Path=/;
                Max-Age=0
              required: true
              schema:
                type: string
              style: simple
        "413":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Length acima de 4 KiB; o corpo nunca é lido
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna; a sessão pode não ter sido revogada
      summary: Encerra a sessão
      tags:
      - auth
  /categorias:
    get:
      description: "Ordenada por tipo (despesa antes de receita) e nome sem diferenciar\
        \ caixa. Sem o parâmetro, devolve os dois tipos."
      operationId: getCategorias
      parameters:
      - in: query
        name: tipo
        required: false
        schema:
          type: string
          enum:
          - receita
          - despesa
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Categoria"
          description: Categorias do usuário
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: tipo com valor diferente de receita e despesa
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista as categorias do usuário
      tags:
      - categorias
  /contas:
    get:
      description: "Ordenada por nome sem diferenciar caixa. Sem o parâmetro, devolve\
        \ só as ativas."
      operationId: getContas
      parameters:
      - in: query
        name: arquivadas
        required: false
        schema:
          type: string
          default: false
          enum:
          - "true"
          - "false"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conta"
          description: "Contas ativas, ou só as arquivadas com arquivadas=true"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: arquivadas com valor diferente de true e false
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista as contas do usuário
      tags:
      - contas
    post:
      operationId: postContas
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarContaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta criada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Já existe uma conta do usuário com esse nome, sem diferenciar\
            \ caixa"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Cria uma conta
      tags:
      - contas
  /contas/{id}:
    get:
      operationId: getContasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Devolve uma conta do usuário
      tags:
      - contas
    patch:
      description: "Idempotente: repetir o mesmo valor devolve 200 e a mesma conta."
      operationId: patchContasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarContaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conta"
          description: Conta com o estado novo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Conta de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou conta travada por mais de 2 s
      security:
      - cookieAuth: []
      summary: Arquiva ou desarquiva uma conta
      tags:
      - contas
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: API e banco respondendo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
          description: Banco indisponível
      summary: Verifica se a API alcança o banco
      tags:
      - health
  /lancamentos:
    get:
      description: "Filtra por dataCaixa, com as duas pontas incluídas, do mais novo\
        \ para o mais antigo (depois criadoEm e id, também decrescentes). de e ate\
        \ são obrigatórios e o intervalo tem no máximo 366 dias contando os dois extremos.\
        \ contaId, se vier, precisa ser um UUID; conta que não é do usuário ou nã\
        o existe devolve lista vazia, sem distinguir."
      operationId: getLancamentos
      parameters:
      - in: query
        name: de
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: ate
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: contaId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lancamento"
          description: Lançamentos do período
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "de ou ate ausente ou fora do formato AAAA-MM-DD (ano de 1900\
            \ a 2199), de depois de ate, intervalo maior que 366 dias ou contaId que\
            \ não é UUID"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Lista os lançamentos do usuário num período
      tags:
      - lancamentos
    post:
      description: "A data enviada vai para dataCompetencia e dataCaixa. Conta e categoria\
        \ precisam ser do usuário, e a categoria precisa ser do mesmo tipo do lanç\
        amento; os três casos de recusa (inexistente, de outro usuário, id inválido)\
        \ têm a mesma mensagem."
      operationId: postLancamentos
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
          description: Lançamento criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado; \"conta nã\
            o encontrada\", \"conta arquivada\", \"categoria não encontrada\" ou \"\
            saldo da conta fora do limite\" (o saldo passaria de 9007199254740991\
            \ centavos, para mais ou para menos)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Cria um lançamento realizado
      tags:
      - lancamentos
  /lancamentos/vencidos:
    get:
      description: "Lançamentos previstos com dataCaixa antes de hoje (America/Sao_Paulo),\
        \ da mais antiga para a mais nova (depois id), no máximo 200. maisAlgum é\
        \ true quando havia mais que isso. Nada muda sozinho: o usuário confirma ou\
        \ cancela cada uma (ADR-028)."
      operationId: getLancamentosVencidos
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LancamentosVencidos"
          description: Previstas vencidas
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível; pode tentar de novo
      security:
      - cookieAuth: []
      summary: Lista as previstas vencidas do usuário
      tags:
      - lancamentos
  /lancamentos/{id}:
    delete:
      description: "Apaga a linha, também numa conta arquivada. O saldo deixa de somá\
        -lo. Ocorrência prevista de recorrência não se apaga (400 \"cancele a ocorrê\
        ncia\"): cancele. Realizada ou cancelada pode ser apagada, e se a data é de\
        \ hoje em diante e a recorrência segue ativa, o job volta a gerar a ocorrê\
        ncia como prevista."
      operationId: deleteLancamentosById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: object
          description: Lançamento apagado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "\"saldo da conta fora do limite\": apagar o lançamento tiraria\
            \ o saldo da faixa de ±9007199254740991 centavos, e nada é apagado; \"\
            use a rota de transferência\": o lançamento é perna de transferência;\
            \ \"cancele a ocorrência\": ocorrência prevista de recorrência"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Lançamento de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Apaga um lançamento
      tags:
      - lancamentos
    get:
      operationId: getLancamentosById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
          description: Lançamento
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Lançamento de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Devolve um lançamento do usuário
      tags:
      - lancamentos
    patch:
      description: "Corpo {\"status\": \"realizado\"} ou {\"status\": \"cancelado\"\
        }. Só uma ocorrência prevista muda de status. Ao confirmar, valorCentavos\
        \ e data são opcionais e gravam o valor e a data reais (a data vale para dataCompetencia\
        \ e dataCaixa); ocorrencia_data da série não muda. Com cancelado, os dois\
        \ dão 400. Confirmar passa a contar no saldo, com a trava e o teto do saldo\
        \ do lançamento, e recusa conta arquivada; cancelar não mexe em saldo e vale\
        \ mesmo com a conta arquivada. As duas são definitivas e deixam a ocorrência\
        \ desgarrada: o job não a recria nem a altera."
      operationId: patchLancamentosById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
          description: Lançamento com o status novo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "\"status é obrigatório\", \"status deve ser realizado ou cancelado\"\
            , campo não declarado, valorCentavos ou data inválidos, valorCentavos\
            \ ou data com cancelado; \"só ocorrência prevista pode mudar de status\"\
            \ (o lançamento não está previsto); \"conta arquivada\" e \"saldo da conta\
            \ fora do limite\" (só ao confirmar); \"use a rota de transferência\"\
            \ (perna de transferência)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Lançamento de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Confirma ou cancela uma ocorrência prevista
      tags:
      - lancamentos
    put:
      description: "Mesmo corpo do POST, substitui todos os campos e grava a data\
        \ nas duas colunas. Mover o lançamento para uma conta arquivada é recusado\
        \ (400 \"conta arquivada\"). Editar sem trocar de conta vale mesmo com a conta\
        \ arquivada, para corrigir lançamento antigo. Numa ocorrência de recorrência\
        \ marca o lançamento como desgarrado (a regra não toca mais nele) e manté\
        m templateId; o status não muda por aqui, e uma ocorrência prevista não conta\
        \ no saldo, então o teto só vale para realizada."
      operationId: putLancamentosById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LancamentoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lancamento"
          description: Lançamento com os valores novos
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado e tipo transferencia;\
            \ \"conta não encontrada\", \"conta arquivada\" (só ao trocar de conta),\
            \ \"categoria não encontrada\", \"saldo da conta fora do limite\" (em\
            \ qualquer das contas afetadas) ou \"use a rota de transferência\" (o\
            \ lançamento é perna de transferência)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Lançamento de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Substitui um lançamento
      tags:
      - lancamentos
  /recorrencias:
    get:
      description: "Ordem por título sem diferenciar maiúscula de minúscula, depois\
        \ por id."
      operationId: getRecorrencias
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recorrencia"
          description: Recorrências do usuário
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: "Lista as recorrências do usuário, ativas e inativas"
      tags:
      - recorrencias
    post:
      description: "Grava a regra, o template e, na mesma transação, as ocorrências\
        \ previstas de max(inicio, hoje) até hoje mais 12 meses, as duas pontas incluí\
        das. A data que a regra gera antes de hoje não vira lançamento. Hoje é a data\
        \ em America/Sao_Paulo. Conta e categoria precisam ser do usuário e a categoria\
        \ do mesmo tipo do template. Uma série que já terminou é criada com zero ocorrê\
        ncias."
      operationId: postRecorrencias
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecorrenciaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecorrenciaCriada"
          description: Recorrência criada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado e combinaç\
            ão de campos que a frequência não aceita; \"conta não encontrada\", \"\
            conta arquivada\" ou \"categoria não encontrada\""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Cria uma recorrência e materializa as ocorrências dos próximos 12 meses
      tags:
      - recorrencias
  /recorrencias/{id}:
    get:
      operationId: getRecorrenciasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recorrencia"
          description: Recorrência
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Recorrência de outro usuário, inexistente ou id que não é\
            \ UUID; todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Devolve uma recorrência do usuário
      tags:
      - recorrencias
    patch:
      description: "Só {\"ativo\": false}. Marca o template como inativo e apaga as\
        \ ocorrências previstas, não desgarradas, de hoje em diante; as de antes de\
        \ hoje e as realizadas ou editadas ficam. Repetir a chamada devolve o mesmo\
        \ estado. Depois da resposta o job não gera mais nada para o template."
      operationId: patchRecorrenciasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecorrenciaAtivoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recorrencia"
          description: Recorrência inativa
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo inválido, inclusive campo não declarado; \"reativar\
            \ não é suportado\""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Recorrência de outro usuário, inexistente ou id que não é\
            \ UUID; todos com o mesmo corpo"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Desativa uma recorrência
      tags:
      - recorrencias
  /transferencias:
    post:
      description: "Cria as duas pernas (tipo transferencia, sem categoria, mesmo\
        \ valor, título, descrição e data nas duas datas) e a ligação numa transaç\
        ão. Origem e destino inexistentes, de outro usuário ou com id inválido tê\
        m a mesma mensagem."
      operationId: postTransferencias
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferenciaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transferencia"
          description: Transferência criada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado; \"conta nã\
            o encontrada\", \"conta arquivada\" (origem ou destino), \"contas devem\
            \ ser diferentes\" ou \"saldo da conta fora do limite\" (em qualquer das\
            \ duas contas)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Move dinheiro entre duas contas do usuário
      tags:
      - transferencias
  /transferencias/{id}:
    delete:
      operationId: deleteTransferenciasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: object
          description: Apagada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "\"saldo da conta fora do limite\": apagar tiraria o saldo\
            \ de uma das contas da faixa de ±9007199254740991 centavos, e nada é apagado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Transferência de outro usuário, inexistente ou id que não\
            \ é UUID; todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Apaga uma transferência e as duas pernas
      tags:
      - transferencias
    get:
      operationId: getTransferenciasById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transferencia"
          description: Transferência
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Transferência de outro usuário, inexistente ou id que não\
            \ é UUID; todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Devolve uma transferência do usuário
      tags:
      - transferencias
components:
  schemas:
    AtualizarContaRequest:
      type: object
      properties:
        arquivada:
          type: boolean
      required:
      - arquivada
    CadastroRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        nome:
          type: string
          maxLength: 100
        senha:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - email
      - senha
    Categoria:
      type: object
      properties:
        cor:
          type:
          - string
          - "null"
          maxLength: 9
        icone:
          type:
          - string
          - "null"
          maxLength: 50
        id:
          type: string
          format: uuid
        nome:
          type: string
          maxLength: 100
          minLength: 1
        paiId:
          type:
          - string
          - "null"
          format: uuid
        tipo:
          type: string
          enum:
          - receita
          - despesa
      required:
      - cor
      - icone
      - id
      - nome
      - paiId
      - tipo
    Conta:
      type: object
      properties:
        arquivada:
          type: boolean
        criadaEm:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        moeda:
          type: string
          enum:
          - BRL
        nome:
          type: string
          maxLength: 100
          minLength: 1
        saldoCentavos:
          type: integer
          format: int64
          description: "Centavos de real, inteiro com sinal"
          maximum: 9007199254740991
          minimum: -9007199254740991
        saldoInicialCentavos:
          type: integer
          format: int64
          description: "Centavos de real, inteiro com sinal"
          maximum: 9007199254740991
          minimum: -9007199254740991
        tipo:
          type: string
          enum:
          - corrente
          - poupanca
          - dinheiro
      required:
      - arquivada
      - criadaEm
      - id
      - moeda
      - nome
      - saldoCentavos
      - saldoInicialCentavos
      - tipo
    CriarContaRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 100
          minLength: 1
        saldoInicialCentavos:
          type: integer
          format: int64
          default: 0
          maximum: 9007199254740991
          minimum: -9007199254740991
        tipo:
          type: string
          enum:
          - corrente
          - poupanca
          - dinheiro
      required:
      - nome
      - tipo
    DivisaoRecorrencia:
      type: object
      properties:
        modo:
          type: string
          enum:
          - percentual
          - valor
        parcelas:
          type: array
          items:
            $ref: "#/components/schemas/ParcelaDivisao"
      required:
      - modo
      - parcelas
    DivisaoRequest:
      type: object
      properties:
        modo:
          type: string
          enum:
          - percentual
          - valor
        parcelas:
          type: array
          description: De 2 a 10 parcelas. A ordem do array é a ordem das parcelas
          items:
            $ref: "#/components/schemas/ParcelaDivisaoRequest"
          maxItems: 10
          minItems: 2
      required:
      - modo
      - parcelas
    Erro:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthError:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthResponse:
      type: object
      properties:
        mensagem:
          type: string
      required:
      - mensagem
    Lancamento:
      type: object
      properties:
        categoriaId:
          type:
          - string
          - "null"
          format: uuid
          description: Nulo só nas pernas de transferência
        contaId:
          type: string
          format: uuid
        criadoEm:
          type: string
          format: date-time
        dataCaixa:
          type: string
          format: date
          description: Quando o dinheiro se move; saldo e fluxo de caixa usam esta
        dataCompetencia:
          type: string
          format: date
          description: Quando o fato aconteceu; gráfico por categoria e orçamento
            usam esta
        descricao:
          type:
          - string
          - "null"
          maxLength: 500
        direcao:
          type:
          - string
          - "null"
          description: "Lado da perna: saida subtrai do saldo, entrada soma; nulo\
            \ nos outros tipos"
          enum:
          - saida
          - entrada
        id:
          type: string
          format: uuid
        parcelaOrdem:
          type:
          - integer
          - "null"
          format: int32
          description: Ordem da parcela na divisão de salário (1 é a primeira); nulo
            fora de divisão
          maximum: 10
          minimum: 1
        status:
          type: string
          enum:
          - previsto
          - realizado
          - cancelado
        templateId:
          type:
          - string
          - "null"
          format: uuid
          description: Id da recorrência que gerou a ocorrência; nulo nos avulsos
        tipo:
          type: string
          enum:
          - receita
          - despesa
          - transferencia
        titulo:
          type: string
          maxLength: 100
          minLength: 1
        transferenciaId:
          type:
          - string
          - "null"
          format: uuid
          description: Id da transferência a que a perna pertence; nulo nos outros
            tipos
        valorCentavos:
          type: integer
          format: int64
          description: "Centavos de real, sempre positivo; o sinal vem do tipo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - categoriaId
      - contaId
      - criadoEm
      - dataCaixa
      - dataCompetencia
      - descricao
      - direcao
      - id
      - parcelaOrdem
      - status
      - templateId
      - tipo
      - titulo
      - transferenciaId
      - valorCentavos
    LancamentoRequest:
      type: object
      properties:
        categoriaId:
          type: string
          format: uuid
        contaId:
          type: string
          format: uuid
        data:
          type: string
          format: date
          description: Grava a mesma data em dataCompetencia e dataCaixa
          example: 2026-03-10
        descricao:
          type:
          - string
          - "null"
          maxLength: 500
        tipo:
          type: string
          enum:
          - receita
          - despesa
        titulo:
          type: string
          maxLength: 100
          minLength: 1
        valorCentavos:
          type: integer
          format: int64
          description: "Centavos de real, sempre positivo; o sinal vem do tipo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - categoriaId
      - contaId
      - data
      - tipo
      - titulo
      - valorCentavos
    LancamentoStatusRequest:
      type: object
      properties:
        data:
          type: string
          format: date
          description: "Só com status realizado: data real, gravada em dataCompetencia\
            \ e dataCaixa"
          example: 2026-03-10
        status:
          type: string
          description: Só uma ocorrência prevista muda de status
          enum:
          - realizado
          - cancelado
        valorCentavos:
          type: integer
          format: int64
          description: "Só com status realizado: valor real, no lugar do previsto"
          maximum: 9007199254740991
          minimum: 1
      required:
      - status
    LancamentosVencidos:
      type: object
      properties:
        lancamentos:
          type: array
          items:
            $ref: "#/components/schemas/Lancamento"
        maisAlgum:
          type: boolean
          description: True quando havia mais de 200 previstas vencidas e a lista
            foi cortada
      required:
      - lancamentos
      - maisAlgum
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        senha:
          type: string
          maxLength: 128
          minLength: 1
      required:
      - email
      - senha
    ParcelaDivisao:
      type: object
      properties:
        diaDoMes:
          type: integer
          format: int32
          maximum: 31
          minimum: 1
        ordem:
          type: integer
          format: int32
          maximum: 10
          minimum: 1
        percentualCentesimos:
          type: integer
          format: int32
          description: "Só no modo percentual. 40% é 4000, 33,33% é 3333"
          maximum: 9999
          minimum: 1
        valorCentavos:
          type: integer
          format: int64
          description: Só no modo valor. Centavos de real
          maximum: 9007199254740991
          minimum: 1
        valorParcelaCentavos:
          type: integer
          format: int64
          description: "Centavos que a parcela gera em cada mês, com a regra do centavo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - diaDoMes
      - ordem
      - valorParcelaCentavos
    ParcelaDivisaoRequest:
      type: object
      properties:
        diaDoMes:
          type: integer
          format: int32
          description: Dia maior que o último do mês cai no último dia
          maximum: 31
          minimum: 1
        percentualCentesimos:
          type:
          - integer
          - "null"
          format: int32
          description: "Só no modo percentual. Centésimos de ponto percentual: 40%\
            \ é 4000, 33,33% é 3333"
          maximum: 9999
          minimum: 1
        valorCentavos:
          type:
          - integer
          - "null"
          format: int64
          description: Só no modo valor. Centavos de real
          maximum: 9007199254740991
          minimum: 1
      required:
      - diaDoMes
    Recorrencia:
      type: object
      properties:
        ativo:
          type: boolean
        categoriaId:
          type: string
          format: uuid
        contaId:
          type: string
          format: uuid
        criadoEm:
          type: string
          format: date-time
        descricao:
          type:
          - string
          - "null"
          maxLength: 500
        divisao:
          anyOf:
          - $ref: "#/components/schemas/DivisaoRecorrencia"
          - type: "null"
          description: Divisão em parcelas; nula quando o template gera uma ocorrência
            por mês
        id:
          type: string
          format: uuid
        proximaOcorrencia:
          type:
          - string
          - "null"
          format: date
          description: Menor dataCaixa entre as previstas de hoje em diante; nula
            se não houver ou se inativa
        regra:
          $ref: "#/components/schemas/RegraRecorrencia"
        tipo:
          type: string
          enum:
          - receita
          - despesa
        titulo:
          type: string
          maxLength: 100
          minLength: 1
        valorCentavos:
          type: integer
          format: int64
          description: "Centavos de real, sempre positivo; o sinal vem do tipo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - ativo
      - categoriaId
      - contaId
      - criadoEm
      - descricao
      - divisao
      - id
      - proximaOcorrencia
      - regra
      - tipo
      - titulo
      - valorCentavos
    RecorrenciaAtivoRequest:
      type: object
      properties:
        ativo:
          type: boolean
          description: "Só false é aceito: a recorrência não é reativada"
      required:
      - ativo
    RecorrenciaCriada:
      type: object
      properties:
        ocorrenciasMaterializadas:
          type: integer
          format: int32
          description: Quantas ocorrências previstas a criação gravou (hoje até hoje
            mais 12 meses)
        recorrencia:
          $ref: "#/components/schemas/Recorrencia"
      required:
      - ocorrenciasMaterializadas
      - recorrencia
    RecorrenciaRequest:
      type: object
      properties:
        categoriaId:
          type: string
          format: uuid
        contaId:
          type: string
          format: uuid
        descricao:
          type:
          - string
          - "null"
          maxLength: 500
        divisao:
          anyOf:
          - $ref: "#/components/schemas/DivisaoRequest"
          - type: "null"
          description: "Divide cada mês em parcelas, uma ocorrência por parcela. Só\
            \ em frequência mensal, e a regra não manda diaDoMes"
        regra:
          $ref: "#/components/schemas/RegraRecorrenciaRequest"
        tipo:
          type: string
          enum:
          - receita
          - despesa
        titulo:
          type: string
          maxLength: 100
          minLength: 1
        valorCentavos:
          type: integer
          format: int64
          description: "Centavos de real, sempre positivo; o sinal vem do tipo"
          maximum: 9007199254740991
          minimum: 1
      required:
      - categoriaId
      - contaId
      - regra
      - tipo
      - titulo
      - valorCentavos
    RegraRecorrencia:
      type: object
      properties:
        diaDaSemana:
          type:
          - integer
          - "null"
          format: int32
          description: Só semanal; 0 é domingo e 6 é sábado
        diaDoMes:
          type:
          - integer
          - "null"
          format: int32
          description: Só mensal
        fim:
          type:
          - string
          - "null"
          format: date
        frequencia:
          type: string
          enum:
          - diaria
          - semanal
          - mensal
          - anual
        inicio:
          type: string
          format: date
        intervalo:
          type: integer
          format: int32
          maximum: 99
          minimum: 1
        ocorrenciasMax:
          type:
          - integer
          - "null"
          format: int32
      required:
      - diaDaSemana
      - diaDoMes
      - fim
      - frequencia
      - inicio
      - intervalo
      - ocorrenciasMax
    RegraRecorrenciaRequest:
      type: object
      properties:
        diaDaSemana:
          type:
          - integer
          - "null"
          format: int32
          description: "Só em semanal, e obrigatório nela. 0 é domingo e 6 é sábado"
          maximum: 6
          minimum: 0
        diaDoMes:
          type:
          - integer
          - "null"
          format: int32
