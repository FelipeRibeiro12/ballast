                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Idempotency-Key já usada com outra rota ou outro corpo
        "503":
          content:
            application/json:
              schema:
