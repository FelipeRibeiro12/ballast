  /movimentos-cripto:
    get:
      description: "Por data decrescente, depois criação e id, o mais novo primeiro.\
        \ contaId e ativoId de outro usuário dão lista vazia. limite (1 a 1000, padrã\
        o 1000) corta a página; se houver mais, o cabeçalho X-Next-Cursor traz o cursor\
        \ para o parâmetro cursor da próxima chamada, com os mesmos filtros. Sem mais\
        \ itens o cabeçalho não vem."
      operationId: getMovimentosCripto
      parameters:
      - in: query
        name: contaId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: ativoId
        required: false
        schema:
          type: string
          format: uuid
      - in: query
        name: limite
        required: false
        schema:
          type: integer
          default: 1000
          maximum: 1000
          minimum: 1
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovimentoCripto"
          description: Movimentos
          headers:
            X-Next-Cursor:
              description: Cursor da próxima página; ausente na última
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "contaId ou ativoId que não é UUID, limite fora de 1 a 1000\
            \ ou cursor inválido"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista os movimentos de cripto do usuário
      tags:
      - cripto
    post:
      description: "A posição do ativo na conta, dia a dia, nunca fica negativa. A\
        \ conta fica travada até o commit."
      operationId: postMovimentosCripto
      parameters:
      - description: "Chave de idempotência, de 1 a 80 caracteres entre letras, dí\
          gitos e . _ : -. Mesma chave, usuário, rota e corpo devolve a resposta 2xx\
          \ original (cabeçalho Idempotent-Replayed: true) sem gravar de novo; vale\
          \ por 24 h."
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 80
          minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovimentoCriptoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovimentoCripto"
          description: Movimento gravado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, conta inexistente, alheia, de outro tipo\
            \ ou arquivada, ativo inexistente ou alheio, quantidade com mais casas\
            \ que o ativo ou venda maior que a posição"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Teto de movimentos do usuário atingido (limite de movimentos
            de cripto atingido)
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Idempotency-Key já usada com outra rota ou outro corpo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou conta travada por mais de 2 s
      security:
      - cookieAuth: []
      summary: Registra uma compra ou venda de cripto numa conta cripto
      tags:
      - cripto
