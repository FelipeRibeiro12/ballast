      operationId: getSaldoProjetado
      parameters:
      - description: "Quantos dias a série tem, contando hoje"
        in: query
        name: dias
        required: false
        schema:
          type: integer
          default: 90
          description: "Quantos dias a série tem, contando hoje"
          maximum: 366
          minimum: 1
      - in: query
        name: contaId
        required: false
        schema:
          type: string
          format: uuid
