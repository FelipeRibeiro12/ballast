  /saldo-projetado:
    get:
      description: "Um ponto por dia, de hoje (America/Sao_Paulo) até hoje + dias\
        \ - 1. O saldo do dia é o saldo inicial das contas mais tudo que é realizado\
        \ ou previsto com dataCaixa até o dia; cancelado nunca entra, e a prevista\
        \ vencida entra pela própria data. Sem contaId soma as contas ativas (transferê\
        ncia entre duas delas se anula; de ativa para arquivada sai do total). Com\
        \ contaId vale só a conta, também arquivada, e a transferência conta pelo\
        \ sinal da perna dela. entradas e saídas de um dia são só os lançamentos com\
        \ dataCaixa naquele dia; a perna de transferência só conta quando a outra\
        \ perna está fora do filtro."
      operationId: getSaldoProjetado
      parameters:
      - description: "Quantos dias a série tem, contando hoje"
        in: query
        name: dias
        required: false
        schema:
          type: integer
          default: 90
          description: "Quantos dias a série tem, contando hoje"
          maximum: 366
          minimum: 1
      - in: query
        name: contaId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
