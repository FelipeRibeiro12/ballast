openapi: 3.1.0
info:
  title: Ballast API
  version: 0.1.0
servers:
- url: /
paths:
  /auth/cadastro:
    post:
      description: "A rota só existe quando REGISTRO_ABERTO=true. Fechado, ela responde\
        \ exatamente como uma rota inexistente (401 sem sessão, 404 com sessão), para\
        \ não revelar que existe."
      operationId: postAuthCadastro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: E-mail já cadastrado
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Cria um usuário
      tags:
      - auth
  /auth/login:
    post:
      description: "A sessão vai no cookie ballast_sessao (HttpOnly, Secure, SameSite=Lax),\
        \ válido por 7 dias absolutos, sem renovação. E-mail inexistente e senha errada\
        \ dão a mesma resposta."
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: ballast_sessao=<token>; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=604800
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Credenciais inválidas
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      summary: Abre uma sessão
      tags:
      - auth
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: API e banco respondendo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
          description: Banco indisponível
      summary: Verifica se a API alcança o banco
      tags:
      - health
components:
  schemas:
    CadastroRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        nome:
          type: string
          maxLength: 100
          minLength: 0
        senha:
          type: string
          maxLength: 128
          minLength: 12
      required:
      - email
      - senha
    Erro:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthError:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    HealthResponse:
      type: object
      properties:
        mensagem:
          type: string
      required:
      - mensagem
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 0
        senha:
          type: string
          maxLength: 128
          minLength: 1
      required:
      - email
      - senha
    Usuario:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        id:
          type: string
          format: uuid
        nome:
          type:
          - string
          - "null"
          maxLength: 100
      required:
      - email
      - id
      - nome
