openapi: 3.1.0
info:
  title: Ballast API
  version: 0.1.0
servers:
- url: /
paths:
  /ativos-cripto:
    get:
      description: "Por símbolo sem diferenciar caixa, depois rede."
      operationId: getAtivosCripto
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AtivoCripto"
          description: Ativos do usuário
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Lista os ativos de cripto do usuário
      tags:
      - cripto
    post:
      description: Identidade é rede mais contrato; contrato nulo é o nativo da rede.
        Nasce confiável.
      operationId: postAtivosCripto
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtivoCriptoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtivoCripto"
          description: Ativo criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado e \"contrato\
            \ inválido para a rede\""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "O usuário já tem um ativo com essa rede e esse contrato, ou\
            \ atingiu o teto de ativos (limite de ativos de cripto atingido)"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Cadastra um ativo de cripto do usuário
      tags:
      - cripto
  /ativos-cripto/{id}:
    delete:
      description: "Ativo com movimentos não se apaga: apague os movimentos antes\
        \ (409)."
      operationId: deleteAtivosCriptoById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: object
          description: Apagado
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Ativo de outro usuário, inexistente ou id que não é UUID;\
            \ mesmo corpo"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: O ativo tem movimentos
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Apaga o ativo e as cotações dele
      tags:
      - cripto
    put:
      description: Rede e contrato são a identidade e não mudam. Menos decimais que
        algum movimento já usa é 409.
      operationId: putAtivosCriptoById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtivoCriptoEdicao"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AtivoCripto"
          description: Ativo editado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Entrada inválida, inclusive campo não declarado como rede\
            \ e contrato"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Ativo de outro usuário, inexistente ou id que não é UUID;\
            \ mesmo corpo"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Há movimento com mais casas decimais que o novo valor
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: "Edita símbolo, nome e decimais do ativo"
      tags:
      - cripto
  /ativos-cripto/{id}/cotacoes:
    post:
      description: "Preço em reais por unidade, em texto. Sem momento, vale o instante\
        \ da requisição."
      operationId: postAtivosCriptoByIdCotacoes
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotacaoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cotacao"
          description: Cotação gravada
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Preço ou momento fora do formato, campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Ativo de outro usuário, inexistente ou id que não é UUID;\
            \ mesmo corpo"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Já existe cotação do ativo nesse instante, ou o usuário atingiu\
            \ o teto de cotações (limite de cotações atingido)"
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Corpo maior que 4 KiB
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Grava uma cotação manual do ativo
      tags:
      - cripto
  /ativos-cripto/{id}/cotacoes/{momento}:
    delete:
      description: Só a cotação manual se apaga; a da CoinGecko é 409.
      operationId: deleteAtivosCriptoByIdCotacoesByMomento
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: momento
        required: true
        schema:
          type: string
      responses:
        "204":
          content:
            application/json:
              schema:
                type: object
          description: Apagada
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Ativo de outro usuário, inexistente, momento sem cotação ou\
            \ fora do formato; mesmo corpo"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Cotação automática
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Apaga uma cotação digitada
      tags:
      - cripto
    put:
      description: O momento no caminho é o da resposta da cotação (ISO-8601 com fuso).
        Só a cotação manual muda; a da CoinGecko é 409.
      operationId: putAtivosCriptoByIdCotacoesByMomento
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: momento
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CotacaoPrecoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cotacao"
          description: Cotação corrigida
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Preço fora do formato, campo não declarado"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Ativo de outro usuário, inexistente, momento sem cotação ou\
            \ fora do formato; mesmo corpo"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Cotação automática
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível
      security:
      - cookieAuth: []
      summary: Corrige o preço de uma cotação digitada
      tags:
      - cripto
  /auth/cadastro:
    post:
      description: "A rota só existe quando REGISTRO_ABERTO=true. Fechado, ela responde\
        \ exatamente como uma rota inexistente (401 sem sessão, 404 com sessão), para\
        \ não revelar que existe."
      operationId: postAuthCadastro
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário criado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Teto de usuários atingido (CADASTRO_MAX_USUARIOS, padrão 20);\
            \ nada é gravado"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: E-mail já cadastrado
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Limite de cadastros por IP (5 por hora) ou de login e cadastro
            somados
          headers:
            Retry-After:
              description: Segundos inteiros até a janela do limite virar
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Argon2 sem vaga livre depois de 5 s de espera
          headers:
            Retry-After:
              description: Sempre 5
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
      summary: Cria um usuário
      tags:
      - auth
  /auth/eu:
    get:
      operationId: getAuthEu
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Usuário da sessão
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Sem cookie, ou token desconhecido, expirado ou revogado; todos\
            \ iguais"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
      security:
      - cookieAuth: []
      summary: Devolve o usuário da sessão
      tags:
      - auth
  /auth/login:
    post:
      description: "A sessão vai no cookie __Host-ballast_sessao (HttpOnly, Secure,\
        \ SameSite=Lax), válido por 7 dias absolutos, sem renovação. Em desenvolvimento,\
        \ com COOKIE_SECURE=false, o nome é ballast_sessao, sem o prefixo. E-mail\
        \ inexistente e senha errada dão a mesma resposta."
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: __Host-ballast_sessao=<token>; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=604800
              required: true
              schema:
                type: string
              style: simple
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginMfaPendente"
          description: "Senha certa com MFA ligado: sem sessão ainda. O código vai\
            \ em POST /auth/login/mfa dentro de 5 minutos"
          headers:
            Set-Cookie:
              description: __Host-ballast_mfa=<token>; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=300
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Entrada inválida
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Credenciais inválidas
        "413":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Corpo maior que 4 KiB, com ou sem Content-Length"
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Type diferente de application/json
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Atraso progressivo em vigor para esse e-mail vindo desse IP,\
            \ resposta idêntica para e-mail com e sem conta; ou limite de login por\
            \ IP (10 por minuto) ou de login e cadastro somados (60 por minuto)"
          headers:
            Retry-After:
              description: "Segundos inteiros, arredondados para cima, até a próxima\
                \ tentativa ser verificada"
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Argon2 sem vaga livre depois de 5 s de espera; a tentativa
            já foi contada
          headers:
            Retry-After:
              description: Sempre 5
              required: true
              schema:
                type: integer
                minimum: 1
              style: simple
      summary: Abre uma sessão
      tags:
      - auth
  /auth/login/mfa:
    post:
      description: "Lê o cookie __Host-ballast_mfa que o POST /auth/login deixou (5\
        \ minutos). Aceita o código do autenticador ou um de recuperação. Certo, abre\
        \ a sessão como o login e expira o cookie do desafio."
      operationId: postAuthLoginMfa
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodigoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
          description: Sessão aberta
          headers:
            Set-Cookie:
              description: "__Host-ballast_sessao=<token>, e __Host-ballast_mfa expirado"
              required: true
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: código inválido (corpo fora do formato)
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "desafio expirado ou inválido, ou código inválido"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Atraso progressivo por usuário depois de 3 códigos errados
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
              style: simple
      summary: Responde o desafio do login com o código
      tags:
      - auth
  /auth/logout:
    post:
      description: Marca a sessão como revogada no servidor e expira o cookie. Sem
        sessão válida também responde 204. Não lê corpo.
      operationId: postAuthLogout
      responses:
        "204":
          description: "Sessão encerrada, ou não havia sessão"
          headers:
            Set-Cookie:
              description: __Host-ballast_sessao=; HttpOnly; Secure; SameSite=Lax;
                Path=/; Max-Age=0
              required: true
              schema:
                type: string
              style: simple
        "413":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Erro"
          description: Content-Length acima de 4 KiB; o corpo nunca é lido
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Falha interna; a sessão pode não ter sido revogada
      summary: Encerra a sessão
      tags:
      - auth
  /auth/mfa:
    get:
      operationId: getAuthMfa
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStatus"
          description: Situação do MFA
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão
      security:
      - cookieAuth: []
      summary: Diz se o MFA está ligado
      tags:
      - auth
  /auth/mfa/ativar:
    post:
      description: "Responde com os códigos de recuperação, que só aparecem aqui.\
        \ Ligar revoga todas as outras sessões do usuário; a atual continua."
      operationId: postAuthMfaAtivar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodigoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaAtivacao"
          description: MFA ligado; os códigos de recuperação não aparecem de novo
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: código inválido
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "configure o mfa antes, ou mfa já ativo"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Atraso progressivo por usuário depois de 3 códigos errados
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
              style: simple
      security:
      - cookieAuth: []
      summary: Liga o MFA com o primeiro código do autenticador
      tags:
      - auth
  /auth/mfa/codigos-de-recuperacao:
    post:
      description: Pede o código do autenticador de agora; código de recuperação não
        vale aqui. Os códigos novos só aparecem nesta resposta. Conta no mesmo atraso
        por usuário do restante do MFA.
      operationId: postAuthMfaCodigosDeRecuperacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodigoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaAtivacao"
          description: Códigos novos; os antigos deixam de valer
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: código inválido
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: mfa não está ativo
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Atraso por usuário em vigor, ou limite por IP"
          headers:
            Retry-After:
              required: true
              schema:
                type: integer
              style: simple
      security:
      - cookieAuth: []
      summary: Gera dez códigos de recuperação novos e invalida os antigos
      tags:
      - auth
  /auth/mfa/configurar:
    post:
      description: Pede a senha. O MFA só liga no POST /auth/mfa/ativar; chamar de
        novo antes disso troca o segredo.
      operationId: postAuthMfaConfigurar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaSenhaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaConfiguracao"
          description: "Segredo novo, ainda não ativo"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: senha incorreta
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: mfa já ativo
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "mfa indisponível: a API está sem MFA_CHAVE"
      security:
      - cookieAuth: []
      summary: Gera o segredo do autenticador
      tags:
      - auth
  /auth/mfa/desativar:
    post:
      description: "Pede a senha e um código, do autenticador ou de recuperação."
      operationId: postAuthMfaDesativar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaDesativarRequest"
        required: true
      responses:
        "204":
          description: MFA desligado
        "400":
          content:
            '*/*':
              schema:
