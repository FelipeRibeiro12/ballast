          content:
            application/json:
              schema:
                type: object
          description: Lançamento apagado
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "\"saldo da conta fora do limite\": apagar o lançamento tiraria\
            \ o saldo da faixa de ±9007199254740991 centavos, e nada é apagado; \"\
            use a rota de transferência\": o lançamento é perna de transferência;\
            \ \"cancele a ocorrência\": ocorrência prevista de recorrência"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Sem sessão válida
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: "Lançamento de outro usuário, inexistente ou id que não é UUID;\
            \ todos com o mesmo corpo"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
          description: Banco indisponível ou trava ocupada por mais de 2 s; pode tentar
            de novo
      security:
      - cookieAuth: []
      summary: Apaga um lançamento
      tags:
      - lancamentos
    get:
      operationId: getLancamentosById
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
